<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица оценок студентов</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Оценки студентов по программированию</h1>

    <table>
        <thead>
            <tr>
                <th>Имя студента</th>
                <th>Курс</th>
                <th>Оценка</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Иван Петров</td>
                <td>Python</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Мария Сидорова</td>
                <td>C#</td>
                <td>85</td>
            </tr>
            <tr>
                <td>Алексей Козлов</td>
                <td>JavaScript</td>
                <td>78</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
