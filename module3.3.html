<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Футбольное поле</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .field {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-color: #2d8a3e;
      background-image:
        repeating-linear-gradient(
          90deg,
          #2d8a3e 0,
          #2d8a3e 80px,
          #338f44 80px,
          #338f44 160px
        );
      cursor: crosshair;
      overflow: hidden;
    }

    .field::before {
      content: "";
      position: absolute;
      inset: 24px;
      border: 4px solid rgba(255, 255, 255, 0.9);
      pointer-events: none;
    }

    .center-line {
      position: absolute;
      top: 24px;
      bottom: 24px;
      left: 50%;
      width: 4px;
      background: rgba(255, 255, 255, 0.9);
      transform: translateX(-50%);
      pointer-events: none;
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 160px;
      height: 160px;
      border: 4px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 12px;
      height: 12px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .penalty-area {
      position: absolute;
      top: 50%;
      width: 18%;
      height: 55%;
      border: 4px solid rgba(255, 255, 255, 0.9);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .penalty-area--left {
      left: 24px;
      border-left: none;
    }

    .penalty-area--right {
      right: 24px;
      border-right: none;
    }

    .ball {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #ffffff 0%, #e8e8e8 45%, #c8c8c8 100%);
      box-shadow:
        inset -8px -12px 16px rgba(0, 0, 0, 0.15),
        4px 8px 16px rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%);
      transition: left 0.6s ease-out, top 0.6s ease-out;
      pointer-events: none;
      z-index: 10;
    }

    .ball::before,
    .ball::after {
      content: "";
      position: absolute;
      background: #222;
      border-radius: 50%;
    }

    .ball::before {
      width: 18px;
      height: 18px;
      top: 22%;
      left: 38%;
    }

    .ball::after {
      width: 14px;
      height: 14px;
      bottom: 28%;
      right: 30%;
    }
  </style>
</head>
<body>
  <div class="field" id="field">
    <div class="center-line"></div>
    <div class="center-circle"></div>
    <div class="center-dot"></div>
    <div class="penalty-area penalty-area--left"></div>
    <div class="penalty-area penalty-area--right"></div>
    <div class="ball" id="ball"></div>
  </div>

  <script>
    const field = document.getElementById("field");
    const ball = document.getElementById("ball");

    const BALL_SIZE = 100;
    const BALL_RADIUS = BALL_SIZE / 2;

    function clampBallCenter(x, y, fieldWidth, fieldHeight) {
      return {
        x: Math.max(BALL_RADIUS, Math.min(fieldWidth - BALL_RADIUS, x)),
        y: Math.max(BALL_RADIUS, Math.min(fieldHeight - BALL_RADIUS, y)),
      };
    }

    function setBallPosition(x, y) {
      ball.style.left = `${x}px`;
      ball.style.top = `${y}px`;
    }

    function placeBallAtCenter() {
      const { width, height } = field.getBoundingClientRect();
      setBallPosition(width / 2, height / 2);
    }

    field.addEventListener("click", (event) => {
      const rect = field.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const clickY = event.clientY - rect.top;

      const { x, y } = clampBallCenter(clickX, clickY, rect.width, rect.height);
      setBallPosition(x, y);
    });

    window.addEventListener("resize", placeBallAtCenter);
    placeBallAtCenter();
  </script>
</body>
</html>
