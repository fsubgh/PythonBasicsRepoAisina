<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список книг</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 2rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
    }

    .book-list {
      list-style: none;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .book {
      padding: 1rem 1.25rem;
      background: #fff;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .book:hover {
      border-color: #ccc;
    }

    .book.selected {
      background: #ff9800;
      border-color: #f57c00;
    }

    .book-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .book-author {
      font-size: 0.875rem;
      color: #666;
    }

    .book.selected .book-author {
      color: #5d4037;
    }
  </style>
</head>
<body>
  <h1>Список книг</h1>
  <ul class="book-list" id="bookList">
    <li class="book">
      <div class="book-title">Война и мир</div>
      <div class="book-author">Лев Толстой</div>
    </li>
    <li class="book">
      <div class="book-title">Преступление и наказание</div>
      <div class="book-author">Фёдор Достоевский</div>
    </li>
    <li class="book">
      <div class="book-title">Мастер и Маргарита</div>
      <div class="book-author">Михаил Булгаков</div>
    </li>
    <li class="book">
      <div class="book-title">Евгений Онегин</div>
      <div class="book-author">Александр Пушкин</div>
    </li>
    <li class="book">
      <div class="book-title">1984</div>
      <div class="book-author">Джордж Оруэлл</div>
    </li>
  </ul>

  <script>
    const bookList = document.getElementById("bookList");
    let selectedBook = null;

    bookList.addEventListener("click", (event) => {
      const book = event.target.closest(".book");
      if (!book) {
        return;
      }

      if (selectedBook) {
        selectedBook.classList.remove("selected");
      }

      if (selectedBook === book) {
        selectedBook = null;
        return;
      }

      book.classList.add("selected");
      selectedBook = book;
    });
  </script>
</body>
</html>
